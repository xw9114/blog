{{ define "body-class" }}reference-page{{ end }}

{{ define "right-sidebar" }}{{ end }}

{{ define "main" }}
<article class="ref-article">
    <header class="ref-page-header">
        {{ with .Params.icon }}
        <div class="ref-page-icon">{{ . | safeHTML }}</div>
        {{ end }}
        <h1 class="ref-page-title">{{ .Title }}</h1>
        {{ with .Description }}
        <p class="ref-page-desc">{{ . }}</p>
        {{ end }}
    </header>

    <div class="ref-content article-content">
        {{ .Content }}
    </div>
</article>
{{ partialCached "footer/footer" . }}

<script>
(function () {
    function openModal(card) {
        var backdrop = document.createElement('div');
        backdrop.className = 'ref-modal-backdrop';

        var box = document.createElement('div');
        box.className = 'ref-modal-box';

        var closeBtn = document.createElement('button');
        closeBtn.className = 'ref-modal-close';
        closeBtn.setAttribute('aria-label', '关闭');
        closeBtn.textContent = '✕';
        closeBtn.addEventListener('click', function () { backdrop.remove(); });

        box.appendChild(closeBtn);
        box.innerHTML += card.innerHTML;
        backdrop.appendChild(box);
        document.body.appendChild(backdrop);

        backdrop.addEventListener('click', function (e) {
            if (e.target === backdrop) backdrop.remove();
        });
        document.addEventListener('keydown', function onKey(e) {
            if (e.key === 'Escape') { backdrop.remove(); document.removeEventListener('keydown', onKey); }
        });
    }

    document.querySelectorAll('.ref-card').forEach(function (card) {
        card.addEventListener('click', function () { openModal(card); });
    });
})();
</script>
{{ end }}
