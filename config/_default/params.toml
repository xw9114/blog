mainSections   = ["post"]
rssFullContent = true
SortBy         = "default"

[footer]
  since      = 2026
  customText = ""

[dateFormat]
  published   = "2006-01-02"
  lastUpdated = "2006-01-02"

[sidebar]
  compact  = false
  emoji    = "🔥"
  subtitle = "探索无限，从月栖之地开始"
  homeTitle = "月栖之地"
  homeSubtitle = "探索无限，从月栖之地开始"
  avatar   = "img/avatar.jpg"

[article]
  headingAnchor = true
  math          = true
  toc           = true
  readingTime   = true

  [article.list]
    showTags = true

  [article.license]
    enabled = false

[widgets]
  homepage = [
    { type = "search" },
    { type = "archives", params = { limit = 5 } },
    { type = "tag-cloud", params = { limit = 10 } },
  ]
  page = [{ type = "toc" }]

[colorScheme]
  toggle  = true
  default = "auto"

[imageProcessing]
  [imageProcessing.content]
    widths  = [800, 1600, 2400]
    enabled = true
  [imageProcessing.thumbnail]
    enabled = true

[backgrounds]
  opacity = 0.30

  [backgrounds.pages]
    "/"           = "/images/backgrounds/nav/home-fuji.jpg"
    "/notes/"     = "/images/backgrounds/nav/notes-forest.jpg"
    "/reference/" = "/images/backgrounds/nav/reference-courtyard.jpg"
    "/archives/"  = "/images/backgrounds/nav/archives-coast.jpg"
    "/search/"    = "/images/backgrounds/nav/search-rain-city.jpg"
    "/about/"     = "/images/backgrounds/nav/about-sakura.jpg"
    "/links/"     = "/images/backgrounds/nav/links-misty-valley.jpg"

[blogAi]
  enabled      = true
  title        = "月栖问答"
  subtitle     = "基于博客文章回答"
  greeting     = "你好，我会先检索月栖之地的文章，再用 Gemini 帮你整理答案。"
  placeholder  = "问问文章、笔记或速查内容..."
  endpoint     = "/api/blog-ai"
  searchIndex  = "/search/index.json"
  contextLimit = 6

[comments]
  enabled = false
